    <link rel="canonical" href="https://www.heoflix.com/" />
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          var canon = document.querySelector('link[rel="canonical"]');
          if (canon && origin) {
            canon.setAttribute('href', origin + (window.location.pathname || '/'));
          }
          var rawSettings = localStorage.getItem("heoflix_app_settings");
          if (rawSettings) {
            var s = JSON.parse(rawSettings);
            if (s.themeMode) document.documentElement.setAttribute('data-theme', s.themeMode);
            if (s.uiDensity) document.documentElement.setAttribute('data-density', s.uiDensity);
            if (s.fontScale) document.documentElement.setAttribute('data-font-scale', s.fontScale);
          }
        } catch(e) {}
      })();
    </script>
